task: "pope_gqa_popular"
dataset_path: chamber111/POPE-GQA
test_split: popular
output_type: generate_until
doc_to_visual: !function utils.pope_doc_to_visual
doc_to_text: !function utils.pope_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 128
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "Look at the image carefully and answer the question based only on what is visibly present. Answer 'yes' only if you can clearly see it. If it is not visible, answer 'no'. If you cannot tell, answer 'unsure'.\n"
    post_prompt: ""
